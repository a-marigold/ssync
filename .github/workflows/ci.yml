name: ci

on: [push, pull_request]

jobs: 
  ci:
    runs-on: ubuntu-latest

    steps: 
      - uses: actions/checkout@v4

      - name: set up zig
        uses: mlugg/setup-zig@v2

      - name: get cache 
        uses: actions/cache@v4
        with: 
          key: zig-cache
          path: ./.zig-cache

      - name: build

        run: zig build
